name: Publish

on:
  workflow_dispatch:
  release:
    types: [ created ]

env:
  TZ: Europe/Zurich

jobs:
  publish:
    name: Publish Release Artifacts
    runs-on: self-hosted

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Java 8 JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 8
          architecture: x64
          cache: 'gradle'
          check-latest: true

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@f9c9c575b8b21b6485636a91ffecd10e558c62f6

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      # The keyring lives in RUNNER_TEMP, which the runner empties after the job, never in the shared home.
      - name: Decode GPG Key
        run: printf '%s' "$SIGNING_SECRET_KEY_RING_FILE" | base64 -d > "$RUNNER_TEMP/secring.gpg"
        env:
          SIGNING_SECRET_KEY_RING_FILE: ${{secrets.SIGNING_SECRET_KEY_RING_FILE}}

      # Signing properties go in as env, not -P arguments, so they stay out of the process list.
      # bash runs the wrapper because dash, Debian's /bin/sh, drops env vars with a dot in the name.
      - name: Publish package
        run: bash ./gradlew publish --warn --stacktrace
        env:
          ORG_GRADLE_PROJECT_signing.keyId: ${{secrets.SIGNING_KEY_ID}}
          ORG_GRADLE_PROJECT_signing.password: ${{secrets.SIGNING_PASSWORD}}
          ORG_GRADLE_PROJECT_signing.secretKeyRingFile: ${{runner.temp}}/secring.gpg
          OSSRH_USERNAME: ${{secrets.OSSRH_USERNAME}}
          OSSRH_PASSWORD: ${{secrets.OSSRH_PASSWORD}}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-build-libs
          path: build/libs
          retention-days: 3
